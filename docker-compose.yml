networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

# This file is for LOCAL DEVELOPMENT ONLY. Production runs the image pushed by
# `task build:image`, composed into the parent AarhusAI stack's
# docker-compose.server.yml — see "Deployment" in README.md. Nothing here is
# deployed, which is why the agent bind-mounts the working tree below.
#
# Do not add a `target: ${TARGET:-dev}` build override: pointing it at the prod
# stage still applies those bind mounts, so you would run host source on top of
# the image you meant to test, with tests/ mounted into it.
services:
  # Service name is "agent" everywhere, including the dev/ overrides. Keeping one
  # name matters: an override file naming a *different* service silently adds a
  # second, buildless service instead of overriding this one.
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    networks:
      - app
      - frontend
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      API_KEY: ${API_KEY:?}
      AGENT_MODEL: ${AGENT_MODEL:-AarhusAI-default-v2}
      AGENT_API_BASE_URL: ${AGENT_API_BASE_URL:-http://litellm.itkdev.dk/v1}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-60}
      PORTAL_SEARCH_URL: ${PORTAL_SEARCH_URL:-https://api.tech.ec.europa.eu/search-api/prod/rest/search}
      PORTAL_API_KEY: ${PORTAL_API_KEY:-SEDIA}
      # Which language's copy of each topic to retrieve, as a JSON array. The
      # index holds every topic in up to 24 languages; "en" has the widest
      # coverage (970 topics vs 536 for "da"), so ["en"] is the default here and
      # in the README. A list is a preference order with per-topic fallback, not
      # a set — the README's ["da","en"] is an example of that, not the default.
      PORTAL_LANGUAGES: ${PORTAL_LANGUAGES:-["en"]}
      PORTAL_CACHE_TTL: ${PORTAL_CACHE_TTL:-21600}
      # Where the trimmed topic corpus is cached: memory (per-process, the
      # default), redis (shared across instances — start it with the "redis"
      # compose profile), or disabled. See app/services/cache.py.
      CACHE_BACKEND: ${CACHE_BACKEND:-memory}
      CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://redis:6379/0}
      # Host-header allowlist for the /mcp endpoint. Override with your proxy's
      # forwarded Host (JSON array); the default is valid JSON so an unset var
      # doesn't break pydantic-settings list parsing.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-["eu-funding-tenders-portal-agent:*","localhost:*"]}
      DEBUG: ${DEBUG:-false}
      RUFF_CACHE_DIR: /tmp/ruff_cache
    volumes:
      # /app/app, not /app: the Dockerfile sets WORKDIR /app and copies the
      # Python package to /app/app, so the mount has to land on the package
      # path. Mounting the host repo at /app instead would hide the installed
      # pyproject.toml and the site-packages install, breaking --reload.
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro

  # Both mocks sit behind compose profiles so a plain `docker compose up` runs
  # only the agent. NOTE: depends_on does NOT activate a profile — the Taskfile
  # has to pass `--profile mock` / `--profile mockllm` explicitly, or the agent
  # starts with nothing to talk to.
  mock-portal:
    build:
      context: ./dev/mock-portal
    networks:
      - app
    profiles:
      - mock
      - mockportal
    environment:
      RUFF_CACHE_DIR: /tmp/ruff_cache

  mock-llm:
    build:
      context: ./dev/mock-llm
    networks:
      - app
    profiles:
      - mock
      - mockllm
    environment:
      RUFF_CACHE_DIR: /tmp/ruff_cache

  # Shared corpus cache, for exercising CACHE_BACKEND=redis locally. Behind a
  # profile because the default is "memory" — `task up` needs no Redis.
  # `task up:redis` passes both the profile and CACHE_BACKEND=redis. Definition
  # mirrors AarhusAI/search-agent's.
  #
  # In production do NOT run this service: the parent AarhusAI stack already
  # provides a Redis, so point CACHE_REDIS_URL at that instead (see README).
  #
  # No `ports:` — the agent reaches it by service name on the app network, and
  # `docker compose exec redis redis-cli` covers inspection. Publishing it would
  # expose the cache on a host port for nothing.
  redis:
    image: redis:7-alpine
    networks:
      - app
    profiles:
      - redis
    # allkeys-lru rather than the default noeviction: one corpus measures 4.2 MB,
    # so 256 MB holds ~60 profile/language combinations, and evicting the coldest
    # beats refusing writes.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./.docker/data/redis/:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
